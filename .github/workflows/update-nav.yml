name: Update Thai Fund NAV

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 06:00 น. เวลาไทย ทุกวัน (ปรับได้)
  workflow_dispatch: {}      # ให้กดรันเองได้จากแท็บ Actions บน GitHub

permissions:
  contents: write

jobs:
  update-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch NAV data
        run: python fetch_nav.py
        env:
          SEC_API_KEY: ${{ secrets.SEC_API_KEY }}

      - name: Commit and push updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nav_latest.csv nav_latest.html index.html
          git diff --staged --quiet || git commit -m "Update NAV data $(date -u +%Y-%m-%d)"
          git push
